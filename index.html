<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a221b" />
    <title>Duskmire</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232a221b'/%3E%3Ccircle cx='16' cy='18' r='7' fill='%235e7048'/%3E%3Ccircle cx='16' cy='12' r='4' fill='%23c4a15a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <p class="eyebrow">The marsh road</p>
          <h1>Duskmire</h1>
        </div>
        <div id="combat-badge" aria-live="polite"></div>
        <div id="skills"></div>
        <button id="settings-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22">
            <path fill="currentColor" d="M19.4 13.5a7.7 7.7 0 0 0 .06-1.5 7.7 7.7 0 0 0-.06-1.5l2.02-1.58a.5.5 0 0 0 .12-.64l-1.91-3.3a.5.5 0 0 0-.6-.22l-2.38.96a7.4 7.4 0 0 0-2.6-1.5l-.36-2.54A.5.5 0 0 0 13.2 1h-3.4a.5.5 0 0 0-.49.42l-.36 2.54a7.4 7.4 0 0 0-2.6 1.5l-2.38-.96a.5.5 0 0 0-.6.22l-1.91 3.3a.5.5 0 0 0 .12.64L3.6 10.5a7.7 7.7 0 0 0 0 3l-2.02 1.58a.5.5 0 0 0-.12.64l1.91 3.3a.5.5 0 0 0 .6.22l2.38-.96a7.4 7.4 0 0 0 2.6 1.5l.36 2.54a.5.5 0 0 0 .49.42h3.4a.5.5 0 0 0 .49-.42l.36-2.54a7.4 7.4 0 0 0 2.6-1.5l2.38.96a.5.5 0 0 0 .6-.22l1.91-3.3a.5.5 0 0 0-.12-.64L19.4 13.5zM11.5 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
          </svg>
          <span>Settings</span>
        </button>
      </header>
      <div id="settings-panel" hidden role="dialog" aria-label="Graphics settings"></div>
      <div id="layout">
        <div id="stage">
          <canvas id="view" aria-label="Marsh road"></canvas>
          <div id="splats"></div>
          <div id="vignette"></div>
          <canvas id="minimap" width="296" height="184" aria-hidden="true"></canvas>
          <p id="nameplate" hidden></p>
          <p id="road-hint" hidden></p>
          <div id="plates">
            <div id="plate-player" class="plate"></div>
            <div id="plate-enemy" class="plate"></div>
          </div>
          <div id="compare-chrome" hidden>
            <p class="compare-tag" data-side="standard">Standard</p>
            <p class="compare-tag" data-side="detailed">Detailed</p>
            <button id="compare-close" type="button">Close comparison</button>
          </div>
          <p id="stage-error" hidden></p>
        </div>
        <aside id="sidebar">
          <section id="pack" aria-label="Inventory and equipment"></section>
          <section id="select-screen"></section>
          <section id="fight-screen" hidden></section>
        </aside>
      </div>
    </div>
    <div id="result" hidden></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
